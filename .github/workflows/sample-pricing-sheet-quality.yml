name: Sample pricing sheet quality

on:
  push:
    paths:
      - "pricing-model/sample-pricing-sheet/**"
      - ".github/workflows/sample-pricing-sheet-quality.yml"
  pull_request:
    paths:
      - "pricing-model/sample-pricing-sheet/**"
      - ".github/workflows/sample-pricing-sheet-quality.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate reusable pricing project
        run: node pricing-model/sample-pricing-sheet/scripts/validate-project.mjs
